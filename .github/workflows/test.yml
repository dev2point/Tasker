name: Test Suite & CI Quality Gate

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - 'public/assets/**'
      - 'public/*.png'
      - 'public/*.svg'
      - 'public/*.ico'
      - '.github/workflows/drizzle-migrations.yml'
  pull_request:
    branches:
      - main
      - master
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - 'public/assets/**'
      - 'public/*.png'
      - 'public/*.svg'
      - 'public/*.ico'
      - '.github/workflows/drizzle-migrations.yml'
  workflow_dispatch:
    inputs:
      run_build:
        description: 'Exécuter également le build de production Next.js'
        required: false
        default: true
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: 🧪 Lint & Suite de Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js (with npm cache)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund || npm install --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: 🔍 Lint codebase
        id: lint
        run: npm run lint

      - name: 🧪 Execute Vitest test suite
        id: vitest
        run: npm test

      - name: 🛡️ Security Dependency Audit (SCA)
        id: audit
        run: npm audit --audit-level=high

      - name: 📊 Generate CI Summary Report
        if: always()
        run: |
          lint_status="${{ steps.lint.outcome }}"
          test_status="${{ steps.vitest.outcome }}"
          audit_status="${{ steps.audit.outcome }}"

          format_badge() {
            case "$1" in
              success) echo "✅ Passé" ;;
              failure) echo "❌ Échec" ;;
              cancelled) echo "🚫 Annulé" ;;
              skipped) echo "⏭️ Ignoré" ;;
              *) echo "ℹ️ $1" ;;
            esac
          }

          {
            echo "## 🧪 Rapport d'Exécution CI (Quality Gate)"
            echo ""
            echo "| Étape | Statut | Détails |"
            echo "| :--- | :---: | :--- |"
            echo "| **Linter (ESLint)** | $(format_badge "$lint_status") | Analyse statique du code |"
            echo "| **Suite de Tests (Vitest)** | $(format_badge "$test_status") | Tests unitaires & d'intégration |"
            echo "| **Audit Sécurité (npm audit)** | $(format_badge "$audit_status") | Détection des vulnérabilités hautes/critiques |"
            echo ""
            if [ "${{ github.event_name }}" = "push" ]; then
              echo "> ℹ️ **Optimisation quota :** le build de production Next.js est réservé aux Pull Requests et aux lancements manuels."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  production-build:
    name: 🏗️ Build Next.js Production
    needs: quality-gate
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.run_build != false && inputs.run_build != 'false')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js (with npm cache)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund || npm install --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: ⚡ Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('app/**', 'components/**', 'lib/**', 'src/**', 'next.config.*') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-
            ${{ runner.os }}-nextjs-

      - name: 🏗️ Verify Next.js production build
        id: build
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: 1

      - name: 📊 Build Summary Report
        if: always()
        run: |
          build_status="${{ steps.build.outcome }}"
          if [ "$build_status" = "success" ]; then
            badge="✅ Passé"
          else
            badge="❌ Échec ($build_status)"
          fi
          {
            echo "## 🏗️ Rapport Build Next.js"
            echo ""
            echo "| Étape | Statut |"
            echo "| :--- | :---: |"
            echo "| **Compilation Next.js Production** | $badge |"
          } >> "$GITHUB_STEP_SUMMARY"
