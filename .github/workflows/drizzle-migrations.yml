name: Drizzle PostgreSQL Migrations

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'src/db/**'
      - 'drizzle/**'
      - 'drizzle.config.ts'
      - 'scripts/verify-db.mjs'
      - '.github/workflows/drizzle-migrations.yml'
  workflow_dispatch:

 concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-migrations:
    name: Run Database Migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 🔐 Verify DATABASE_URL secret before setup
        id: check_secret
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "has_db=false" >> "$GITHUB_OUTPUT"
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "❌ ERREUR: Le secret DATABASE_URL n'est pas défini dans les secrets GitHub du repository."
              echo "Veuillez ajouter DATABASE_URL dans Settings > Secrets and variables > Actions."
              exit 1
            else
              echo "::notice::Secret DATABASE_URL absent : migration ignorée sur push automatique pour préserver le quota mensuel."
              {
                echo "### ⏭️ Drizzle Migrations ignorées (secret absent)"
                echo "- Le secret \`DATABASE_URL\` n'est pas configuré sur ce dépôt."
                echo "- L'installation de Node.js et des dépendances a été évitée afin d'économiser les minutes de runner."
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "has_db=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 📥 Checkout repository
        if: steps.check_secret.outputs.has_db == 'true'
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js (with npm cache)
        if: steps.check_secret.outputs.has_db == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install dependencies (including drizzle & drizzle-kit)
        if: steps.check_secret.outputs.has_db == 'true'
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund || npm install --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: 🚀 Run PostgreSQL Schema Migrations
        if: steps.check_secret.outputs.has_db == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          echo "📦 Exécution des migrations Drizzle..."
          npm run db:migrate

          echo "🔍 Vérification des tables et politiques RLS créées..."
          node scripts/verify-db.mjs

      - name: ✅ Migration Summary
        if: success() && steps.check_secret.outputs.has_db == 'true'
        run: |
          {
            echo "### 🚀 Drizzle Migrations appliquées avec succès !"
            echo "- **Base de données** : PostgreSQL / Supabase"
            echo "- **Branche** : \`${{ github.ref_name }}\`"
            echo "- **Commit** : \`${{ github.sha }}\`"
            echo "- **Statut** : Schéma relationnel à jour."
          } >> "$GITHUB_STEP_SUMMARY"
