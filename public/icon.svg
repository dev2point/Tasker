<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#312e81" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bgGrad)" filter="url(#shadow)" />

  <!-- Inner Calendar / Task Sheet -->
  <rect x="96" y="96" width="320" height="320" rx="48" fill="#ffffff" />

  <!-- Calendar Header Band -->
  <path d="M96 144 C96 117.49 117.49 96 144 96 L368 96 C394.51 96 416 117.49 416 144 L416 176 L96 176 Z" fill="#e0e7ff" />

  <!-- Binder Rings / Pins -->
  <rect x="160" y="72" width="32" height="48" rx="16" fill="#4338ca" />
  <rect x="320" y="72" width="32" height="48" rx="16" fill="#4338ca" />

  <!-- Task Item 1: Checked -->
  <rect x="144" y="216" width="36" height="36" rx="10" fill="url(#checkGrad)" />
  <path d="M152 234 L160 242 L172 226" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  <rect x="200" y="226" width="168" height="16" rx="8" fill="#6366f1" />

  <!-- Task Item 2: Checked -->
  <rect x="144" y="280" width="36" height="36" rx="10" fill="url(#checkGrad)" />
  <path d="M152 298 L160 306 L172 290" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  <rect x="200" y="290" width="128" height="16" rx="8" fill="#818cf8" />

  <!-- Task Item 3: In Progress / Sparkle -->
  <rect x="144" y="344" width="36" height="36" rx="10" fill="#e0e7ff" stroke="#6366f1" stroke-width="3" />
  <circle cx="162" cy="362" r="6" fill="#4f46e5" />
  <rect x="200" y="354" width="144" height="16" rx="8" fill="#c7d2fe" />
</svg>
